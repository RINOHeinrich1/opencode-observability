<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestrator — Supervision</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">Orchestrator <span class="muted">— supervision &amp; pilotage</span></div>
    <div class="header-right">
      <span id="last-updated" class="muted" title="Dernière mise à jour">—</span>
      <label for="org-select" class="muted">Organisation</label>
      <select id="org-select" title="Organisation active (filtre tout le panneau)"></select>
      <button id="org-manage-btn" class="ghost" title="Gérer les organisations">Organisations</button>
      <label for="refresh-select" class="muted">Rafraîchissement</label>
      <select id="refresh-select" title="Intervalle de rafraîchissement automatique">
        <option value="10">10 s</option>
        <option value="30">30 s</option>
        <option value="60">60 s</option>
        <option value="120">120 s</option>
        <option value="0">Manuel</option>
      </select>
      <button id="refresh-btn" class="ghost" title="Actualiser maintenant">Actualiser</button>
      <a href="/docs/README.md" target="_blank" rel="noopener" class="ghost docs-link" title="Documentation du framework">Docs</a>
      <span id="whoami" class="muted"></span>
      <span class="readonly-banner badge queued" title="Rôle superviseur — accès en lecture seule (aucune action d'écriture)">Superviseur (lecture seule)</span>
      <button id="logout-btn" class="ghost">Déconnexion</button>
    </div>
  </header>
  <nav id="tabs"></nav>
  <div id="project-banner" hidden></div>

  <main>
    <section id="pane-overview" class="pane active"></section>
    <section id="pane-observability" class="pane"></section>
    <section id="pane-projects" class="pane"></section>
    <section id="pane-tasks" class="pane"></section>
    <section id="pane-e2etests" class="pane"></section>
    <section id="pane-e2esecrets" class="pane"></section>
    <section id="pane-cadrages" class="pane"></section>
    <section id="pane-recettes" class="pane"></section>
    <section id="pane-events" class="pane"></section>
    <section id="pane-deployments" class="pane"></section>
    <section id="pane-decisions" class="pane"></section>
    <section id="pane-artifacts" class="pane"></section>
    <section id="pane-plans" class="pane"></section>
    <section id="pane-archives" class="pane"></section>
    <section id="pane-ecosystem" class="pane"></section>
    <section id="pane-workspaces" class="pane"></section>
    <section id="pane-users" class="pane"></section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop" hidden></div>

  <script src="/vendor/chart.umd.js"></script>
  <script src="/app.js"></script>
</body>
</html>
